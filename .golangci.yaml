version: "2"
run:
  modules-download-mode: readonly
output:
  sort-order:
    - file
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - copyloopvar
    - decorder
    - depguard
    - dogsled
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - gocheckcompilerdirectives
    - gochecknoinits
    - gosec
    - govet
    - ineffassign
    - intrange
    - musttag
    - nestif
    - nlreturn
    - nolintlint
    - sloglint
    - staticcheck
    - thelper
    - unused
    - wsl_v5
  settings:
    asasalint:
      use-builtin-exclusions: true
    decorder:
      disable-dec-order-check: false
      disable-init-func-first-check: false
      disable-dec-num-check: false
      disable-type-dec-num-check: false
      disable-const-dec-num-check: false
      disable-var-dec-num-check: false
    depguard:
      rules:
        avoid-list:
          list-mode: lax
          deny:
            - pkg: github.com/libgit2/git2go
              desc: Requires cgo. Shell out to the git CLI instead.

            - pkg: github.com/go-git/go-git
              desc: Shell out to the git CLI instead; see CLAUDE.md.

            - pkg: io/ioutil
              desc: Deprecated since Go 1.16. Use os and io instead.

            - pkg: github.com/pkg/errors
              desc: This package has been archived. Use standard library package errors instead.

            - pkg: github.com/bouk/monkey
              desc: Use methodical dependency injection instead of monkeypatching.

            - pkg: github.com/agiledragon/gomonkey
              desc: Use methodical dependency injection instead of monkeypatching.
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      attr-only: true
      no-global: all
      context: all
      static-msg: true
    wsl_v5:
      allow-first-in-block: false
      allow-whole-block: true
      branch-max-lines: 4
  exclusions:
    generated: lax
    rules:
      # Reading the config files the user names with --config, or that sit in
      # the scanned repository, is the loader's purpose.
      - path: ^cfg/config\.go$
        linters:
          - gosec
        text: G304
      # Fixture paths are built from test-controlled names under testdata/ and
      # a per-test temp dir.
      - path: ^(cfg/config|cmd/gelato/main)_test\.go$
        linters:
          - gosec
        text: G304|G703
      # git is the fixed executable; arguments are built from pinned option
      # lists, object IDs and repository paths, never passed to a shell.
      - path: ^git/repo\.go$
        linters:
          - gosec
        text: 'G204: Subprocess launched with'
      # Test fixtures run git with test-chosen arguments.
      - path: ^internal/gittest/gittest\.go$
        linters:
          - gosec
        text: 'G204: Subprocess launched with'
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
